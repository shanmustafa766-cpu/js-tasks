<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .app{
            margin:auto;
            
            text-align: center;
        }
.intro{background-color: blue;
color: aliceblue;
height:70px;
width:60%;
margin: auto;
line-height: 70px;}
.head{color:rgba(46, 46, 172, 0.9);}
input{display: block;
margin:auto;
height:45px;
width:25%;
color: blueviolet;
font-size: 25px;
border:1px solid whitesmoke;
box-shadow:3px 3px 15px lightblue,-3px -3px 15px lightblue ;
border-radius: 3px;

}
#answer{color: rgba(46, 46, 172, 0.9);}
input::placeholder{color:purple;}
button{width:15%;
    height:50px;
    border: none;
    border-radius: 3px;
background-color: blue;
font-size: 25px;
color: ghostwhite;
margin-top:20px;}
input:focus{
    outline: none;
}
p{font-size: 23px;}
    </style>
</head>
<body>
    <div class="app">
        <h1 class="intro">NUMBER GUESSING GAME</h1>
<h1 class="head">GUESS NUMBER BETWEEN 1-15!</h1>
<input type="text" id="guess" placeholder="guess the number..... ">
<button onclick="guessing()">GUESS</button>
<p id="comment"></p>
<p id="attempt"></p>
<p id="answer"></p>
    </div>
    <script>
        let guessInput=document.getElementById("guess");
        let answer=document.getElementById("answer");
        let atm=document.getElementById("attempt");
        let cmt=document.getElementById("comment");
let min=1;
let max=15;
let target=Math.floor(Math.random()*(max-min+1)+min);
let attempt=0;
function guessing(){
    let guess=Number(guessInput.value);

if(isNaN(guess)||guess<min||guess>max){
answer.innerHTML="⚠ Please enter valid number!!!!";
guessInput.value="";
guessInput.focus();
return;
}
attempt++;
 if(guess<target){
    cmt.innerHTML="YOUR GUESSED NUMBER IS: "+guess;
   answer.innerHTML="⚠ Too low!!! "; 
   atm.innerHTML="ATTEMPTS: "+attempt;
}
else if(guess>target){
     cmt.innerHTML="YOUR GUESSED NUMBER IS: "+guess;
   answer.innerHTML="⚠ Too high!!! "; 
atm.innerHTML="ATTEMPTS: "+attempt;
}
else{ cmt.innerHTML="YOUR GUESSED NUMBER IS: "+guess;
  answer.innerHTML="🥇 Correct!!!!, you guessed right in "+attempt+" attempts.";  
atm.innerHTML="ATTEMPTS: "+attempt;
attempt=0;
target=Math.floor(Math.random()*(max-min+1)+min);
}
guessInput.value="";
guessInput.focus();


}

    </script>
</body>
</html>
